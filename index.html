<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تقييم تجربتك</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, "Tahoma", sans-serif;
      background: #178579;
      min-height: 100vh;
      color: #111;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      padding: 25px 18px 40px;
      text-align: center;
    }

    /* =========================
       الشعار العلوي
    ========================= */

    .top-logo {
      width: 250px;
      max-width: 75%;
      height: auto;
      margin: 5px auto 15px;
      display: block;

      /* تحويل الشعار إلى أبيض */
      filter: brightness(0) invert(1);

      image-rendering: auto;
    }

    /* =========================
       العناوين
    ========================= */

    .title {
      font-size: 32px;
      font-weight: 800;
      color: #000;
      margin-top: 5px;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .subtitle {
      font-size: 21px;
      color: #d2d2d2;
      margin-bottom: 28px;
      line-height: 1.6;
    }

    .heart {
      color: #fff;
      font-size: 23px;
      margin-right: 5px;
    }

    /* =========================
       بطاقة التقييم
    ========================= */

    .rating-card {
      width: 100%;
      max-width: 660px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 34px;
      padding: 38px 24px 35px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
    }

    /* الشعار داخل بطاقة التقييم */

    .card-logo {
      width: 300px;
      max-width: 80%;
      height: auto;
      display: block;
      margin: 0 auto 25px;
    }

    /* =========================
       النجوم
    ========================= */

    .stars {
      direction: ltr;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin: 10px auto 28px;
    }

    .star {
      border: none;
      background: transparent;
      padding: 0;
      margin: 0;
      cursor: pointer;

      font-size: 62px;
      line-height: 1;

      color: #d6d6d6;

      transition:
        transform 0.15s ease,
        color 0.15s ease;
    }

    .star:hover {
      transform: scale(1.08);
    }

    .star.active {
      color: #f1c644;
    }

    /* =========================
       الإيموجي
    ========================= */

    .emoji {
      font-size: 95px;
      line-height: 1;
      margin: 5px auto 20px;

      min-height: 100px;

      display: flex;
      justify-content: center;
      align-items: center;

      transition: transform 0.2s ease;
    }

    .emoji.animate {
      transform: scale(1.12);
    }

    /* =========================
       الملاحظات
    ========================= */

    .notes-section {
      text-align: right;
      margin-top: 5px;
    }

    .notes-label {
      display: block;
      font-size: 22px;
      font-weight: 700;
      color: #222;
      margin-bottom: 10px;
    }

    .optional {
      font-weight: 400;
      color: #777;
    }

    textarea {
      width: 100%;
      min-height: 145px;
      resize: vertical;

      border: 1px solid #dedede;
      border-radius: 22px;

      padding: 18px;
      font-family: inherit;
      font-size: 18px;
      color: #222;

      outline: none;
      background: #fff;

      transition: border-color 0.2s ease,
                  box-shadow 0.2s ease;
    }

    textarea::placeholder {
      color: #888;
    }

    textarea:focus {
      border-color: #178579;
      box-shadow: 0 0 0 3px rgba(23, 133, 121, 0.12);
    }

    /* =========================
       زر Google
    ========================= */

    .google-section {
      margin-top: 25px;
    }

    .google-button {
      width: 100%;
      border: none;
      border-radius: 18px;

      background: #178579;
      color: #fff;

      padding: 18px 20px;

      font-family: inherit;
      font-size: 21px;
      font-weight: 700;

      cursor: pointer;
      text-decoration: none;

      display: block;

      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    .google-button:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .google-button:active {
      transform: scale(0.98);
    }

    .google-star {
      font-size: 25px;
      vertical-align: middle;
      margin-left: 7px;
    }

    /* =========================
       رسالة بعد الاختيار
    ========================= */

    .thank-you {
      display: none;
      margin-top: 18px;
      color: #178579;
      font-size: 19px;
      font-weight: 700;
    }

    /* =========================
       الجوال
    ========================= */

    @media (max-width: 600px) {

      .page {
        padding: 18px 14px 35px;
      }

      .top-logo {
        width: 235px;
        max-width: 82%;
        margin-bottom: 12px;
      }

      .title {
        font-size: 29px;
      }

      .subtitle {
        font-size: 19px;
        margin-bottom: 22px;
      }

      .rating-card {
        border-radius: 30px;
        padding: 30px 18px 28px;
      }

      .card-logo {
        width: 270px;
        max-width: 88%;
        margin-bottom: 18px;
      }

      .stars {
        gap: 5px;
        margin-bottom: 25px;
      }

      .star {
        font-size: 48px;
      }

      .emoji {
        font-size: 82px;
        min-height: 90px;
        margin-bottom: 18px;
      }

      .notes-label {
        font-size: 20px;
      }

      textarea {
        min-height: 130px;
        font-size: 17px;
      }

      .google-button {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <!-- =========================
         الشعار العلوي
    ========================== -->

    <img
      src="logo.png"
      alt="عنبه"
      class="top-logo"
    >

    <!-- =========================
         العنوان
    ========================== -->

    <h1 class="title">
      كيف كانت تجربتك؟
    </h1>

    <p class="subtitle">
      رأيك يهمنا ويصنع الفرق
      <span class="heart">🤍</span>
    </p>

    <!-- =========================
         بطاقة التقييم
    ========================== -->

    <section class="rating-card">

      <!-- الشعار داخل البطاقة -->
      <img
        src="logo.png"
        alt="عنبه"
        class="card-logo"
      >

      <!-- الإيموجي -->
      <div
        id="emoji"
        class="emoji"
        aria-live="polite"
      >
        🙂
      </div>

      <!-- النجوم -->
      <div
        class="stars"
        id="stars"
        aria-label="اختر تقييمك"
      >

        <button class="star" data-rating="1" aria-label="نجمة واحدة">
          ★
        </button>

        <button class="star" data-rating="2" aria-label="نجمتان">
          ★
        </button>

        <button class="star" data-rating="3" aria-label="ثلاث نجوم">
          ★
        </button>

        <button class="star" data-rating="4" aria-label="أربع نجوم">
          ★
        </button>

        <button class="star" data-rating="5" aria-label="خمس نجوم">
          ★
        </button>

      </div>

      <!-- =========================
           الملاحظات
      ========================== -->

      <div class="notes-section">

        <label
          for="notes"
          class="notes-label"
        >
          ملاحظتك
          <span class="optional">(اختياري)</span>
        </label>

        <textarea
          id="notes"
          placeholder="اكتب لنا ملاحظتك أو اقتراحك..."
        ></textarea>

      </div>

      <!-- =========================
           زر Google
      ========================== -->

      <div class="google-section">

        <!--
          مهم:
          ضع رابط Google الخاص بالمطعم/الفرع
          مكان الرابط الموجود هنا.
        -->

        <a
          id="googleButton"
          class="google-button"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="google-star">⭐</span>
          قيّمنا على Google
        </a>

      </div>

      <div
        id="thankYou"
        class="thank-you"
      >
        شكرًا لك، رأيك يهمنا 🤍
      </div>

    </section>

  </main>


  <script>

    /* =====================================
       عناصر الصفحة
    ===================================== */

    const stars = document.querySelectorAll(".star");
    const emoji = document.getElementById("emoji");
    const thankYou = document.getElementById("thankYou");


    /* =====================================
       الإيموجيات حسب التقييم
    ===================================== */

    const emojis = {
      1: "😞",
      2: "😕",
      3: "🙂",
      4: "😍",
      5: "🤩"
    };


    /* =====================================
       النصوص حسب التقييم
    ===================================== */

    const messages = {
      1: "نأسف إن تجربتك ما كانت بالمستوى المطلوب",
      2: "نتمنى نقدر نقدم لك تجربة أفضل",
      3: "شكرًا لتقييمك، ونسعى دائمًا للأفضل",
      4: "سعداء جدًا إن تجربتك أعجبتك",
      5: "سعداء جدًا بتجربتك! شكرًا لك 🤍"
    };


    /* =====================================
       عند الضغط على النجوم
    ===================================== */

    stars.forEach((star) => {

      star.addEventListener("click", () => {

        const rating = Number(
          star.getAttribute("data-rating")
        );


        /* تلوين النجوم */

        stars.forEach((item) => {

          const itemRating = Number(
            item.getAttribute("data-rating")
          );

          if (itemRating <= rating) {
            item.classList.add("active");
          } else {
            item.classList.remove("active");
          }

        });


        /* تغيير الإيموجي */

        emoji.textContent = emojis[rating];


        /* حركة بسيطة */

        emoji.classList.remove("animate");

        void emoji.offsetWidth;

        emoji.classList.add("animate");


        /* إظهار رسالة الشكر */

        thankYou.style.display = "block";


        /* تغيير نص الرسالة */

        thankYou.textContent =
          messages[rating];

      });

    });


    /* =====================================
       منع إرسال النموذج قبل اختيار التقييم
       ===================================== */

    const googleButton =
      document.getElementById("googleButton");

    googleButton.addEventListener("click", (event) => {

      const selectedStar =
        document.querySelector(".star.active");

      if (!selectedStar) {

        event.preventDefault();

        alert("فضلاً اختر تقييمك أولاً ⭐");

      }

    });

  </script>

</body>
</html>
