<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تقييم تجربة عنبه | Anbah Feedback</title>
<style>
:root{--green:#087765;--green2:#10927d;--ink:#155f53;--mint:#b9dfd2;--gold:#c99a36}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:15px 14px 38px;overflow-x:hidden;font-family:Tahoma,Arial,sans-serif;color:#34433f;background:radial-gradient(ellipse at 12% 12%,#15977b 0,transparent 30%),radial-gradient(ellipse at 90% 83%,#20a585 0,transparent 28%),linear-gradient(145deg,#006b58,#087c67 52%,#005e4d);display:flex;align-items:center;flex-direction:column}
.leaf-art{position:fixed;z-index:0;pointer-events:none;width:220px;opacity:.95;filter:drop-shadow(0 12px 12px #003c2d55)}.leaf-top{top:-24px;left:-40px;transform:rotate(-14deg)}.leaf-side{top:145px;right:-48px;width:150px;transform:rotate(25deg);opacity:.72}.leaf-bottom{bottom:-35px;right:-35px;width:210px;transform:rotate(38deg);opacity:.75}
.lang{position:relative;z-index:2;margin:0 auto 4px;border:1px solid #ffffff9c;background:#ffffff20;color:white;border-radius:999px;padding:11px 25px;font:bold 15px Arial,Tahoma;cursor:pointer;backdrop-filter:blur(4px)}
.logo{width:165px;height:128px;object-fit:contain;filter:brightness(0) invert(1);position:relative;z-index:1;margin:2px auto 12px}
.card{width:min(100%,480px);position:relative;z-index:1;background:linear-gradient(180deg,#fff 0%,#fcfffd 100%);border-radius:36px;padding:62px 22px 30px;box-shadow:0 24px 55px #003f332e;text-align:center;margin:24px 0 20px;border:1px solid #ffffffaa}
.badge{position:absolute;top:-54px;left:50%;transform:translateX(-50%);width:108px;height:108px;border-radius:50%;background:linear-gradient(#fff,#fdfdfd);border:5px solid #e8f5f0;box-shadow:0 8px 20px #004b3b20, inset 0 0 0 2px #c89a3b;display:grid;place-items:center}.badge svg{width:60px;height:60px}
h1{margin:10px 0 8px;font-size:clamp(25px,7vw,32px);font-weight:800;color:var(--ink)}.subtitle{margin:0 0 20px;color:#77817d;font-size:16px;line-height:1.7}
.search{width:100%;border:2px solid #80cdb5;border-radius:999px;padding:16px 18px;font:15px Tahoma,Arial;background:#fbfefd;color:#34433f;text-align:center;outline:none;margin-bottom:16px}.search:focus,textarea:focus,.contact:focus{border-color:var(--green2);box-shadow:0 0 0 4px #10927d12}
.branch-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-height:490px;overflow:auto;padding:2px 2px 8px}.branch{min-height:112px;border:2px solid #85cdb8;border-radius:26px;background:linear-gradient(160deg,#fff,#f2fbf7);box-shadow:0 5px 0 #d7e9e2,0 8px 12px #00664d12;color:var(--ink);padding:12px 9px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:7px;font:700 17px Tahoma,Arial;cursor:pointer;transition:.18s}.branch:before{content:"⌖";width:39px;height:39px;border-radius:50%;display:grid;place-items:center;background:#dcf4ec;color:#168b76;font-size:24px;font-weight:normal}.branch:hover,.branch:active{background:#e6f6f0;border-color:#168b77;transform:translateY(-1px)}.branch-en{font:14px Arial,sans-serif;color:#8b9691;direction:ltr}.no-results{display:none;color:#77817d;padding:14px}
.rating{display:none}.selected{display:inline-block;background:#e8f6f0;border:1px solid #c9e5d9;border-radius:999px;padding:8px 15px;color:var(--ink);font-weight:bold;margin-bottom:6px}.change{display:block;margin:0 auto 15px;border:1px solid var(--mint);border-radius:999px;background:#fff;color:var(--ink);padding:9px 17px;font:13px Tahoma;cursor:pointer}.stars{display:flex;direction:ltr;justify-content:center;gap:5px;margin:8px 0 14px}.star{border:0;background:transparent;padding:0 2px;color:#e1e6e3;font-size:clamp(39px,11vw,54px);line-height:1;cursor:pointer}.star.active{color:#ffbf19;filter:drop-shadow(0 3px 2px #d59c1740)}
.feedback{display:none;margin-top:16px;padding:18px 13px;background:#f8fcfa;border:1px solid #dceee7;border-radius:24px}.feedback.show{display:block}.message{margin:0 0 14px;color:var(--ink);font-size:17px;font-weight:bold;line-height:1.7}.categories{display:grid;grid-template-columns:1fr 1fr;gap:9px}.category{border:2px solid var(--mint);background:white;color:var(--ink);border-radius:999px;padding:12px 8px;font:700 14px Tahoma;cursor:pointer}.category.selected{background:#e3f4ee;border-color:#178d78}.category:last-child{grid-column:1/-1;width:65%;justify-self:center}textarea,.contact{width:100%;margin-top:12px;border:2px solid var(--mint);border-radius:15px;padding:13px;font:14px Tahoma,Arial;background:#fff;color:#333;outline:none}textarea{min-height:105px;resize:vertical}.submit,.google{width:100%;border:0;border-radius:999px;padding:15px;margin-top:13px;font:bold 16px Tahoma;cursor:pointer}.submit{background:linear-gradient(135deg,#087765,#10927d);color:#fff}.google{background:linear-gradient(135deg,#ffca37,#f4a900);color:#513b00}.status{display:none;margin-top:11px;color:var(--green);font-weight:bold;font-size:14px}.status.show{display:block}.note{margin-top:11px;color:#929b97;font-size:12px}
body.en{direction:ltr;font-family:Arial,Tahoma,sans-serif}body.en .card{text-align:center}body.en .search,body.en textarea,body.en .contact{direction:ltr;text-align:left}body.en .categories{direction:ltr}body.en .branch{direction:ltr}body.en .selected{direction:ltr}
@media(max-width:380px){.card{padding:57px 15px 24px;border-radius:29px}.branch-grid{gap:9px}.branch{min-height:98px;font-size:15px;border-radius:22px}.logo{width:145px;height:110px}.star{font-size:40px}.leaf-art{width:175px}}
</style>
</head>
<body>
<svg class="leaf-art leaf-top" viewBox="0 0 260 250" aria-hidden="true"><defs><linearGradient id="leafG" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#78d64b"/><stop offset=".48" stop-color="#209d38"/><stop offset="1" stop-color="#075b2d"/></linearGradient></defs><g fill="url(#leafG)" stroke="#7edc62" stroke-opacity=".38" stroke-width="1.2"><path d="M125 130C64 123 26 65 16 8c57 12 107 48 109 122Z"/><path d="M125 130C136 62 185 22 250 12c-6 67-51 113-125 118Z"/><path d="M125 130C73 161 36 202 26 244c59-8 96-48 99-114Z"/><path d="M125 130C166 157 212 185 244 222c-13-57-51-91-119-92Z"/></g><g fill="none" stroke="#c1f08b" stroke-opacity=".55" stroke-width="2"><path d="M125 130L22 15M125 130L242 18M125 130L30 239M125 130L239 218M125 130L70 75M125 130L188 67"/></g></svg>
<svg class="leaf-art leaf-side" viewBox="0 0 260 250" aria-hidden="true"><g fill="#35ad46" stroke="#91e66a" stroke-opacity=".35"><path d="M125 130C64 123 26 65 16 8c57 12 107 48 109 122Z"/><path d="M125 130C136 62 185 22 250 12c-6 67-51 113-125 118Z"/><path d="M125 130C73 161 36 202 26 244c59-8 96-48 99-114Z"/><path d="M125 130C166 157 212 185 244 222c-13-57-51-91-119-92Z"/></g><g fill="none" stroke="#b6ef8d" stroke-opacity=".55" stroke-width="2"><path d="M125 130L22 15M125 130L242 18M125 130L30 239M125 130L239 218"/></g></svg>
<svg class="leaf-art leaf-bottom" viewBox="0 0 260 250" aria-hidden="true"><g fill="#35ad46" stroke="#91e66a" stroke-opacity=".35"><path d="M125 130C64 123 26 65 16 8c57 12 107 48 109 122Z"/><path d="M125 130C136 62 185 22 250 12c-6 67-51 113-125 118Z"/><path d="M125 130C73 161 36 202 26 244c59-8 96-48 99-114Z"/><path d="M125 130C166 157 212 185 244 222c-13-57-51-91-119-92Z"/></g><g fill="none" stroke="#b6ef8d" stroke-opacity=".55" stroke-width="2"><path d="M125 130L22 15M125 130L242 18M125 130L30 239M125 130L239 218"/></g></svg>

<button class="lang" id="langToggle" type="button">English</button>
<img class="logo" src="logo.png" alt="عنبه / Anbah">
<main class="card"><div class="badge" aria-hidden="true"><svg viewBox="0 0 100 100"><path d="M49 87C36 75 23 68 18 52 13 34 23 20 40 15c14-5 28 1 36 15 7 14 3 31-9 43-6 6-12 10-18 14Z" fill="#087765"/><path d="M50 86C52 63 61 42 75 23" fill="none" stroke="#d1a44a" stroke-width="5" stroke-linecap="round"/><path d="M45 66 28 43M53 53 40 31M60 43 55 26M53 61 74 48" fill="none" stroke="#a6d99a" stroke-width="3" stroke-linecap="round"/></svg></div>
<section id="branchScreen">
<h1 data-t="branchTitle">اختر الفرع</h1>
<p class="subtitle" data-t="branchSub">أي فرع قمت بزيارته؟</p>
<input id="search" class="search" type="search" placeholder="ابحث عن الفرع..." aria-label="ابحث عن الفرع">
<div id="branches" class="branch-grid"></div>
<div id="empty" class="no-results">لا توجد فروع مطابقة لبحثك</div>
</section>
<section id="ratingScreen" class="rating">
<div id="selected" class="selected"></div>
<button id="change" class="change" type="button">تغيير الفرع</button>
<h1 data-t="ratingTitle">كيف كانت تجربتك؟</h1>
<p class="subtitle" data-t="ratingSub">رأيك يهمنا ويصنع الفرق</p>
<div class="stars" aria-label="Rating">
<button class="star" data-rating="1" aria-label="1 star">★</button><button class="star" data-rating="2" aria-label="2 stars">★</button><button class="star" data-rating="3" aria-label="3 stars">★</button><button class="star" data-rating="4" aria-label="4 stars">★</button><button class="star" data-rating="5" aria-label="5 stars">★</button>
</div>
<section id="negative" class="feedback">
<p class="message" data-t="negativeMsg">نعتذر منك 🙏 ساعدنا لحل المشكلة</p>
<div class="categories">
<button class="category" data-category="الأكل" data-t="food">🍽️ الأكل</button><button class="category" data-category="الخدمة" data-t="service">🙋‍♂️ الخدمة</button><button class="category" data-category="السرعة" data-t="speed">⏱️ السرعة</button><button class="category" data-category="النظافة" data-t="clean">✨ النظافة</button><button class="category" data-category="أخرى" data-t="other">💬 أخرى</button>
</div>
<textarea id="note" placeholder="اكتب ملاحظتك (اختياري)"></textarea>
<input id="contact" class="contact" type="text" placeholder="رقم الجوال أو البريد للتواصل (اختياري)">
<button id="send" class="submit" type="button">إرسال ملاحظتك</button><div id="negativeStatus" class="status"></div>
<div class="note" data-t="note">ملاحظتك تساعدنا نحسن تجربتك 🤍</div>
</section>
<section id="positive" class="feedback">
<p class="message" data-t="positiveMsg">يسعدنا إنك استمتعت! 🎉 شاركنا رأيك في Google ⭐</p>
<button id="google" class="google" type="button">⭐ قيمنا على Google</button><div id="positiveStatus" class="status"></div>
</section>
</section>
</main>
<script>
(() => {
const SHEETS="https://script.google.com/macros/s/AKfycbxm1m2QRjR9l8RRTkk8wdSAm43c0FhcAxx_TipGDMM_Wp_1-2K9q90ZtWMwEJkrPpVX/exec";
const BRANCHES=[
{id:"almughrizat",ar:"المغرزات",en:"Al Mughrizat",url:"https://maps.app.goo.gl/5z4T9W9VDjqMA1EPA?g_st=ac"},
{id:"althumamah",ar:"الثمامة",en:"Al Thumamah",url:"https://maps.app.goo.gl/uSNfXh5opFWWRstp8?g_st=ac"},
{id:"alsafa",ar:"الصفا",en:"Al Safa",url:"https://maps.app.goo.gl/3tMVTEtGkmNHybpw5"},
{id:"alrayan",ar:"الريان",en:"Al Rayyan",url:"https://maps.app.goo.gl/C3pDUv39WiEyiEHBA"},
{id:"alsuwaidi",ar:"السويدي",en:"Al Suwaidi",url:"https://maps.app.goo.gl/ZLj9X1omjuFAB2MD9"},
{id:"alshifa",ar:"الشفاء",en:"Al Shifa",url:"https://maps.app.goo.gl/i2JPkBFirMCb6FMa8"},
{id:"alnaseem",ar:"النسيم",en:"Al Naseem",url:"https://maps.app.goo.gl/CnaMRxx7XhPvrBUx8"},
{id:"alarid",ar:"العارض",en:"Al Arid",url:"https://maps.app.goo.gl/nnrXyrjJ8g6k8v847"},
{id:"alquds",ar:"القدس",en:"Al Quds",url:"https://maps.app.goo.gl/41ypzzX53x6PLWkz8"},
{id:"alqirawan",ar:"القيروان",en:"Al Qirawan",url:"https://maps.app.goo.gl/2fvNZb5Vf3mmJTYt6"},
{id:"almalqa",ar:"الملقا",en:"Al Malqa",url:"https://maps.app.goo.gl/nMMRsbfMQZoxf53X9"},
{id:"alnarjis",ar:"النرجس",en:"Al Narjis",url:"https://maps.app.goo.gl/ytUh8HF9vGeU2vHG6"},
{id:"alnazim",ar:"النظيم",en:"Al Nazim",url:"https://maps.app.goo.gl/yqKCwsFzgTsdUWGw7"},
{id:"alnahdah",ar:"النهضة",en:"Al Nahdah",url:"https://maps.app.goo.gl/hGDCiiPa2L5Do5Yw8"},
{id:"ghirnatah",ar:"غرناطة",en:"Ghirnatah",url:"https://maps.app.goo.gl/RRZgYE27UonvRcoeA"},
{id:"aisha",ar:"عائشة",en:"Aisha",url:"https://maps.app.goo.gl/b6znFuL32D6ghoHT6"},
{id:"irqa",ar:"عرقة",en:"Irqah",url:"https://maps.app.goo.gl/UsDqr94fkBqd8P3u5"},
{id:"qurtubah",ar:"قرطبة",en:"Qurtubah",url:"https://maps.app.goo.gl/9WidDd8hfLmnxH8N8"},
{id:"laban",ar:"لبن",en:"Laban",url:"https://maps.app.goo.gl/3osUHaS4gue8uLts8"}
];
const T={
ar:{branchTitle:"اختر الفرع",branchSub:"أي فرع قمت بزيارته؟",search:"ابحث عن الفرع...",empty:"لا توجد فروع مطابقة لبحثك",change:"تغيير الفرع",ratingTitle:"كيف كانت تجربتك؟",ratingSub:"رأيك يهمنا ويصنع الفرق",negativeMsg:"نعتذر منك 🙏 ساعدنا لحل المشكلة",food:"🍽️ الأكل",service:"🙋‍♂️ الخدمة",speed:"⏱️ السرعة",clean:"✨ النظافة",other:"💬 أخرى",notePlaceholder:"اكتب ملاحظتك (اختياري)",contactPlaceholder:"رقم الجوال أو البريد للتواصل (اختياري)",send:"إرسال ملاحظتك",note:"ملاحظتك تساعدنا نحسن تجربتك 🤍",positiveMsg:"يسعدنا إنك استمتعت! 🎉 شاركنا رأيك في Google ⭐",google:"⭐ قيمنا على Google",branchLabel:"الفرع المختار: ",choose:"اختر نوع المشكلة أولاً 🙏",sending:"جاري الإرسال...",sent:"تم استلام ملاحظتك، شكرًا لك 🤍",submitted:"تم الإرسال ✓",opening:"جاري فتح Google...",unavailable:"رابط تقييم Google غير متوفر لهذا الفرع."},
en:{branchTitle:"Choose a branch",branchSub:"Which branch did you visit?",search:"Search branches…",empty:"No branches match your search",change:"Change branch",ratingTitle:"How was your experience?",ratingSub:"Your feedback matters and helps us improve",negativeMsg:"We're sorry 🙏 Please tell us what went wrong",food:"🍽️ Food",service:"🙋‍♂️ Service",speed:"⏱️ Speed",clean:"✨ Cleanliness",other:"💬 Other",notePlaceholder:"Your comments (optional)",contactPlaceholder:"Phone or email (optional)",send:"Send feedback",note:"Your feedback helps us improve 🤍",positiveMsg:"We're glad you enjoyed it! 🎉 Leave us a review on Google ⭐",google:"⭐ Rate us on Google",branchLabel:"Selected branch: ",choose:"Please choose an issue type first 🙏",sending:"Sending…",sent:"Thank you! Your feedback has been received 🤍",submitted:"Sent ✓",opening:"Opening Google…",unavailable:"Google review link unavailable for this branch."}
};
let lang="ar", branch=null, rating=0, category="";
const $=id=>document.getElementById(id);
function translate(){
 const t=T[lang];
 document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
 document.body.classList.toggle("en",lang==="en");
 $("langToggle").textContent=lang==="ar"?"English":"العربية";
 document.querySelectorAll("[data-t]").forEach(el=>{let k=el.dataset.t;if(t[k])el.textContent=t[k]});
 $("search").placeholder=t.search;
 $("empty").textContent=t.empty;
 $("change").textContent=t.change;
 $("note").placeholder=t.notePlaceholder;
 $("contact").placeholder=t.contactPlaceholder;
 $("send").textContent=t.send;
 $("google").textContent=t.google;
 if(branch)$("selected").textContent=t.branchLabel+(lang==="ar"?branch.ar:branch.en);
 renderBranches($("search").value);
}
function renderBranches(q=""){
 const needle=q.trim().toLowerCase();
 const found=BRANCHES.filter(b=>b.ar.includes(q.trim())||b.en.toLowerCase().includes(needle));
 $("branches").replaceChildren();
 found.forEach(b=>{
  const btn=document.createElement("button");btn.type="button";btn.className="branch";
  const main=document.createElement("span");main.textContent=lang==="ar"?b.ar:b.en;
  if(lang==="ar"){const sub=document.createElement("span");sub.className="branch-en";sub.textContent=b.en;btn.append(main,sub)}else btn.append(main);
  btn.addEventListener("click",()=>chooseBranch(b));$("branches").append(btn);
 });
 $("empty").style.display=found.length?"none":"block";
}
function chooseBranch(b){branch=b;$("selected").textContent=T[lang].branchLabel+(lang==="ar"?b.ar:b.en);$("branchScreen").style.display="none";$("ratingScreen").style.display="block";reset();window.scrollTo({top:0,behavior:"smooth"});}
function reset(){rating=0;category="";document.querySelectorAll(".star").forEach(s=>s.classList.remove("active"));$("negative").classList.remove("show");$("positive").classList.remove("show");$("negativeStatus").classList.remove("show");$("positiveStatus").classList.remove("show");document.querySelectorAll(".category").forEach(c=>c.classList.remove("selected"));$("note").value="";$("contact").value="";$("send").disabled=false;$("google").disabled=false;$("send").textContent=T[lang].send;$("google").textContent=T[lang].google;}
function showFeedback(){ $("negative").classList.toggle("show",rating<=3);$("positive").classList.toggle("show",rating>=4);$("negativeStatus").classList.remove("show");$("positiveStatus").classList.remove("show");}
function updateStars(){document.querySelectorAll(".star").forEach(s=>s.classList.toggle("active",Number(s.dataset.rating)<=rating));}
async function sendSheets(action="feedback"){
 const data={branch:branch?.ar||"",branchEnglish:branch?.en||"",branchId:branch?.id||"",timestamp:new Date().toISOString(),rating,category,note:$("note").value.trim(),contact:$("contact").value.trim(),action};
 try{await fetch(SHEETS,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(data)});return true}catch(e){console.error(e);return false}
}
$("langToggle").addEventListener("click",()=>{lang=lang==="ar"?"en":"ar";translate()});
$("search").addEventListener("input",e=>renderBranches(e.target.value));
$("change").addEventListener("click",()=>{$("ratingScreen").style.display="none";$("branchScreen").style.display="block";$("search").value="";renderBranches();reset();window.scrollTo({top:0,behavior:"smooth"});});
document.querySelectorAll(".star").forEach(s=>s.addEventListener("click",()=>{rating=Number(s.dataset.rating);updateStars();showFeedback();}));
document.querySelectorAll(".category").forEach(c=>c.addEventListener("click",()=>{document.querySelectorAll(".category").forEach(x=>x.classList.remove("selected"));c.classList.add("selected");category=c.dataset.category;}));
$("send").addEventListener("click",async()=>{if(!category){$("negativeStatus").textContent=T[lang].choose;$("negativeStatus").classList.add("show");return;} $("send").disabled=true;$("send").textContent=T[lang].sending;await sendSheets();$("negativeStatus").textContent=T[lang].sent;$("negativeStatus").classList.add("show");$("send").textContent=T[lang].submitted;});
$("google").addEventListener("click",async()=>{if(!branch?.url){$("positiveStatus").textContent=T[lang].unavailable;$("positiveStatus").classList.add("show");return;}$("google").disabled=true;$("google").textContent=T[lang].opening;await sendSheets("google_review");window.location.href=branch.url;});
renderBranches();
})();
</script>
</body>
</html>
